# CI for Loopwork (SC-7). Mirrors `pnpm check:full`, split into parallel jobs. Authorized by the T09 brief (CI config is
# "ask first" in CAPABILITY-MAP.md). No secrets are used anywhere; the token is read-only.
#
# LOOPWORK_BASE_REF (floor-guard, changed-line coverage): pull_request -> the PR base sha; push to main -> the sha before
# the push (`github.event.before`). A brand-new ref has an all-zero `before`; the scripts then fall back to HEAD^.
# It is passed through `env:`, never interpolated into a script.
#
# Pinned tools (no third-party actions): gitleaks 8.30.1 and osv-scanner 2.7.0 are release binaries verified against a
# pinned sha256; semgrep 1.181.0 is pinned by version in a venv (not by hash: --require-hashes needs every transitive
# dependency hashed, which is not practical here).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOOPWORK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --redact --no-banner
      - name: Floor guard
        run: |
          set -euo pipefail
          if [[ ! "$LOOPWORK_BASE_REF" =~ [1-9a-f] ]]; then LOOPWORK_BASE_REF=$(git rev-parse HEAD^); export LOOPWORK_BASE_REF; fi
          git log --format=%B "$LOOPWORK_BASE_REF"..HEAD > "$RUNNER_TEMP/commit-msgs.txt"
          scripts/floor-guard.sh --commit-msg-file "$RUNNER_TEMP/commit-msgs.txt"

  task:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOOPWORK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Unit tests with the changed-line coverage gate
        run: |
          set -euo pipefail
          if [[ ! "$LOOPWORK_BASE_REF" =~ [1-9a-f] ]]; then LOOPWORK_BASE_REF=$(git rev-parse HEAD^); export LOOPWORK_BASE_REF; fi
          pnpm test --coverage
      - run: pnpm check:arch

  pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        ports:
          - "127.0.0.1:55432:5432"
        env:
          POSTGRES_USER: loopwork
          POSTGRES_PASSWORD: loopwork
          POSTGRES_DB: loopwork_test
        options: >-
          --health-cmd "pg_isready -U loopwork -d loopwork_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LOOPWORK_TEST_DATABASE_URL: postgres://loopwork:loopwork@127.0.0.1:55432/loopwork_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm test:pg

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install semgrep 1.181.0
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep==1.181.0
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - run: semgrep scan --config p/default --config p/typescript --error

  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install osv-scanner 2.7.0
        env:
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
          echo "$OSV_SHA256  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: osv-scanner scan source -r .
